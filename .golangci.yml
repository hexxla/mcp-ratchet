# .golangci.yml
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - revive
    - whitespace
    - copyloopvar

  settings:
    depguard:
      rules:
        library_domain:
          files:
            - "**/pkg/ratchet/domain/**.go"
          deny:
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/adapters"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/mcp"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/ports"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/services"
              desc: Dependencies must point toward the core.

        library_ports:
          files:
            - "**/pkg/ratchet/ports/**.go"
          deny:
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/adapters"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/mcp"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/services"
              desc: Dependencies must point toward the core.

        library_services:
          files:
            - "**/pkg/ratchet/services/**.go"
            - "!**/pkg/ratchet/services/ratchet_service_test.go"
          deny:
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/adapters"
              desc: Dependencies must point toward the core.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/mcp"
              desc: Dependencies must point toward the core.

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    revive:
      rules:
        - name: error-strings
        - name: error-return
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hexxla/mcp-ratchet

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
