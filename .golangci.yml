# .golangci.yml
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - revive
    - copyloopvar

  settings:
    depguard:
      rules:
        library_core:
          files:
            - "**/pkg/ratchet/*.go"
            - "!**/*_test.go"
          list-mode: strict
          allow:
            - $gostd

        library_adapters:
          files:
            - "**/pkg/ratchet/adapters/**.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/modelcontextprotocol/go-sdk"
              desc: MCP transport belongs in its own adapter.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/mcp"
              desc: YAML and history must not depend on MCP transport.

        library_mcp:
          files:
            - "**/pkg/ratchet/mcp/**.go"
            - "!**/*_test.go"
          deny:
            - pkg: "gopkg.in/yaml.v3"
              desc: YAML decoding belongs in the configuration adapter.
            - pkg: "github.com/hexxla/mcp-ratchet/pkg/ratchet/adapters"
              desc: SDK middleware must not own configuration or history.

    gocritic:
      enabled-tags:
        - diagnostic

    revive:
      rules:
        - name: error-strings
        - name: error-return
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hexxla/mcp-ratchet

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
