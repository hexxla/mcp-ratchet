# Completion lifetime belongs to the successful producer tool.
completion_ttl: 15s
rules:
  - tool: greet
  - tool: get_user_name
    after_any: [greet]
    consume: true
    message: Call greet before get_user_name.
  - tool: get_time
    after_any: [get_user_name]
    message: Call get_user_name before get_time.
  - tool: get_date
    after_any: [get_time]
    message: Call get_time before get_date.
